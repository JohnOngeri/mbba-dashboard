<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBBA Management Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: replica of the MBBA Dashboard Graphics frames. Navy title bar, white tab bar, month pills,
   headline, linked KPI strip, stat stack + chart, facts + table, recommendations. Single light theme by design. */
:root{
  --navy:#1f2a6b;--green:#3fa535;--red:#c8102e;--amber:#e08a00;--grey:#f3f4f8;--line:#e6e8ef;
  --ink:#1f2a6b;--text:#2d3557;--muted:#7a809a;--lblue:#9dbbe0;--pblue:#dce6f4;--page:#ffffff;--canvas:#ecedf1;
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--text);font-family:var(--f);font-size:13px}
.sheet{max-width:1120px;margin:0 auto;background:var(--page);min-height:100vh}
.bar{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 28px}
.bar b{font-weight:800;font-size:15px}
.bar span{font-size:11px;color:#dfe3f3}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 20px;scrollbar-width:none}
nav button{border:0;background:none;font:500 12.5px var(--f);color:var(--muted);padding:13px 12px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--navy);font-weight:700;border-bottom-color:var(--green)}
nav button:hover{color:var(--navy)}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.inner{padding-inline:28px;padding-block:18px 30px}
.months{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:26px}
.months .lab{font:700 10px var(--f);letter-spacing:.1em;color:var(--muted);margin-right:8px}
.months button{border:1px solid var(--line);background:#fff;color:var(--navy);font:500 12px var(--f);padding:7px 13px;border-radius:20px;cursor:pointer}
.months button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.months.off{opacity:.35;pointer-events:none}
h1{color:var(--navy);font:700 clamp(19px,2.4vw,24px)/1.3 var(--f);margin:0 0 22px;max-width:760px;text-wrap:balance}
.kpi{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;background:var(--grey);border-radius:6px;padding:11px 16px;margin-bottom:8px;font-size:12px}
.kpi .lk{font:700 9.5px var(--f);letter-spacing:.1em;color:var(--muted)}
.kpi .nm{font-weight:700;color:var(--navy)}
.kpi .tg{color:var(--muted)}
.kpi .st{margin-left:auto;font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .st i{width:8px;height:8px;border-radius:50%;display:inline-block}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:34px;margin-top:22px}
.stack{display:grid;gap:22px;align-content:start}
.big{font:800 40px/1 var(--f);color:var(--green);font-variant-numeric:tabular-nums}
.big.red{color:var(--red)}
.bl{font-weight:700;color:var(--navy);font-size:13px;margin-top:6px}
.bs{font-size:11px;color:var(--muted);margin-top:3px}
.ct{text-align:center;font:800 13.5px var(--f);letter-spacing:.04em;color:var(--navy);text-transform:uppercase;margin:0 0 10px}
.note{text-align:center;font-size:10.5px;color:var(--muted);margin-top:6px}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;font-size:11px;color:var(--text);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.facts{display:grid;gap:12px;align-content:start}
.facts div{border-left:3px solid var(--green);padding:3px 0 3px 12px;font-size:12.5px;line-height:1.5}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-weight:700;color:var(--navy);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:11.5px}
td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--text);font-variant-numeric:tabular-nums}
tr.sel td{font-weight:700;color:var(--navy);background:var(--grey)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--grey)}
.tw{overflow-x:auto;min-width:0}
.recs{background:var(--grey);border-radius:8px;padding:16px 20px;margin-top:28px}
.recs h3{font:800 10.5px var(--f);letter-spacing:.1em;color:var(--green);margin:0 0 10px}
.recs p{margin:0 0 7px;font-size:12.5px}
.foot{font-size:11px;font-style:italic;color:var(--muted);margin-top:18px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--f);font-size:11px;fill:var(--muted)}
svg .v{fill:var(--navy);font-weight:700;font-size:12px}
svg .s{fill:var(--muted);font-size:9.5px}
#tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;font:600 11.5px var(--f);padding:6px 9px;border-radius:5px;opacity:0;transition:opacity .1s;z-index:9}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:#eef3fa;border-radius:6px;padding:14px;text-align:left;border:1px solid transparent;cursor:pointer;font-family:var(--f);color:var(--text)}
.card:hover{border-color:var(--lblue)}
.card .cl{font:700 10px var(--f);letter-spacing:.06em;color:var(--navy);text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.card .cv{font:800 25px var(--f);color:var(--navy);margin:6px 0 4px}
.card .cs{font-size:11px;line-height:1.4}
.card .go{font:700 11px var(--f);color:var(--green);margin-top:8px;display:block}
.story{border:1.5px solid var(--green);border-radius:6px;padding:14px 16px}
.story h4,.dep h4{font:800 10px var(--f);letter-spacing:.08em;margin:0 0 6px;color:var(--navy)}
.dep{border:1.5px solid #3d6fb6;border-radius:6px;padding:14px 16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.footer{background:#3d6fb6;color:#fff;font-size:10.5px;padding:9px 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:820px){.split{grid-template-columns:1fr!important}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.inner,.bar{padding-inline:16px}.footer{padding-inline:16px}}
body{margin:0}
</style>
</head>
<body>

<div class="sheet">
  <div class="bar"><b>MBBA Programme Dashboard</b><span>Prepared by Asakheni SA for the Kgodiso Development Fund</span></div>
  <nav id="nav" aria-label="Dashboard areas"></nav>
  <div class="inner">
    <div class="months" id="months" role="group" aria-label="Choose a month"><span class="lab">MONTH, 2026</span></div>
    <main id="page"></main>
  </div>
  <div class="footer"><span>Prepared by Asakheni SA for the Kgodiso Development Fund</span><span>Data to 28 September 2026. Sources: Enterprise Room, NAYAX sales records, operator surveys</span></div>
</div>
<div id="tip"></div>

<script>
const $=id=>document.getElementById(id),tip=$('tip');
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
const MF=['January','February','March','April','May','June','July','August','September'];
const D={
 full:[31,32,34,35,33,33,34,33,31], inst:[2,1,2,1,2,2,2,4,4], joined:[0,1,2,1,0,0,1,0,0], left:[0,0,0,0,2,0,0,1,2],
 mac:[18,19,22,22,24,24,23,24,24], wait:[13,13,12,13,9,9,11,9,7], minst:[2,1,3,0,3,0,0,1,1], mrem:[0,0,0,0,1,0,1,0,1],
 sales:[52843,106531,167981,165612,171912,144560,108621,151320,127920],
 cum:[425652,532183,700164,865776,1037687,1182247,1290868,1442188,1570108],
 cover:[81.8,81.8,75,75,71.4,71.4,69.4,67.6,68.6], trained:[27,27,27,27,25,25,25,25,24],
 meet:[55,56,57,58,59,60,61,62,63], onb:[3,3,3,3,4,4,4,5,5],
 prof:{5:[22,15,'R410',24],6:[12,4,'-R382',23],7:[6,3,'-R296',24],8:[16,8,'R168',24]}
};
const ST={on:['On track','var(--green)'],risk:['At risk','var(--amber)'],off:['Off track','var(--red)'],closed:['Closed','var(--muted)']};
const RF=v=>(v<0?'-':'')+'R'+Math.abs(v).toLocaleString('en-ZA');
const Rk=v=>v>=1e6?'R'+(v/1e6).toFixed(2)+'m':'R'+Math.round(v/1000)+'k';
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
function tx(p,x,y,s,a={}){const t=el('text',Object.assign({x,y},a),p);t.textContent=s;return t}
function tipOn(e,t){e.addEventListener('mousemove',ev=>{tip.textContent=t;tip.style.opacity=1;tip.style.left=Math.min(ev.clientX+12,innerWidth-220)+'px';tip.style.top=(ev.clientY-36)+'px'});e.addEventListener('mouseleave',()=>tip.style.opacity=0)}
const kpi=(code,name,target,sep,st)=>`<div class="kpi"><span class="lk">LINKED KPI</span><span class="nm">${code} ${name}</span><span class="tg">Target: ${target}</span><span>September 2026: <b>${sep}</b></span><span class="st" style="color:${ST[st][1]}"><i style="background:${ST[st][1]}"></i>${ST[st][0]}</span></div>`;
const stat=(v,l,s,cls='')=>`<div><div class="big ${cls}">${v}</div><div class="bl">${l}</div><div class="bs">${s}</div></div>`;
const facts=a=>`<div class="facts">${a.map(x=>`<div>${x}</div>`).join('')}</div>`;
const recs=a=>`<div class="recs"><h3>WHAT WE RECOMMEND</h3>${a.map(x=>`<p>${x}</p>`).join('')}</div>`;
function table(head,rows,{selIdx=null,clickIdx}={}){return `<div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i===selIdx?'sel':''} ${clickIdx?'click':''}" ${clickIdx?`data-m="${clickIdx(i)}"`:''}>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function wireRows(){document.querySelectorAll('tr[data-m]').forEach(r=>r.onclick=()=>setM(+r.dataset.m))}
const op=(i,m)=>m==null||i===m?1:.3;

/* charts */
function vbars(host,labels,vals,{m=null,idx=i=>i,color='var(--navy)',sub,fmt=v=>v,w=640,h=250,max,tipf}={}){
 const s=el('svg',{viewBox:`0 0 ${w} ${h}`},host),B=26,T=40,n=labels.length,bw=w/n,mx=max||Math.max(...vals)*1.08;
 el('line',{x1:0,x2:w,y1:h-B,y2:h-B,stroke:'var(--line)'},s);
 labels.forEach((lb,i)=>{const v=vals[i],x=i*bw+bw*.22,b=bw*.56,bh=(h-B-T)*v/mx,y=h-B-bh,k=idx(i);
  const r=el('rect',{x,y,width:b,height:bh,fill:color,'fill-opacity':op(k,m),style:'cursor:pointer'},s);r.onclick=()=>setM(k);tipOn(r,tipf?tipf(i):lb+': '+fmt(v));
  tx(s,x+b/2,y-(sub?22:8),fmt(v),{'text-anchor':'middle',class:'v','font-size':14});
  if(sub)tx(s,x+b/2,y-8,sub[i],{'text-anchor':'middle',class:'s'});
  tx(s,x+b/2,h-8,lb,{'text-anchor':'middle',style:'fill:var(--navy);font-weight:700;font-size:10.5px'})});}
function lines(host,series,{m=null,w=640,h=240,mx=30,ticks=[0,10,20,30]}={}){
 const s=el('svg',{viewBox:`0 0 ${w} ${h}`},host),L=34,Rr=14,B=24,T=16,X=i=>L+i*(w-L-Rr)/8,Y=v=>T+(h-B-T)*(1-v/mx);
 ticks.forEach(t=>{el('line',{x1:L,x2:w,y1:Y(t),y2:Y(t),stroke:'var(--line)'},s);tx(s,L-8,Y(t)+4,t,{'text-anchor':'end','font-size':9.5})});
 M.forEach((mm,i)=>tx(s,X(i),h-6,mm,{'text-anchor':'middle','font-size':10}));
 series.forEach(([vals,col,below,name])=>{el('path',{d:vals.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' '),fill:'none',stroke:col,'stroke-width':2.2},s);
  vals.forEach((v,i)=>{const c=el('circle',{cx:X(i),cy:Y(v),r:i===m?6:4.5,fill:'#fff',stroke:col,'stroke-width':2.2,style:'cursor:pointer'},s);c.onclick=()=>setM(i);tipOn(c,MF[i]+': '+v+' '+name);
   tx(s,X(i),below?Y(v)+17:Y(v)-9,v,{'text-anchor':'middle',style:`fill:${col};font-weight:700;font-size:${i===m?12:10}px`})})});}

/* pages */
const P={};
P.recruitment={months:true,r:m=>{const i=m??8;
 return `<h1>${D.full[i]} of the 50 places are filled with a full deposit. The deposit is the main barrier to growth.</h1>
 ${kpi('KPI-01','Active participants with a full deposit','50','31','off')}
 <div class="split"><div class="stack">${stat(D.full[i]+' of 50','Active participants with a full deposit',`${MF[i]} 2026. ${D.inst[i]} more paying in instalments`)}${stat('45','People who have paid a deposit','Since launch in 2024')}${stat('10 of 45','Withdrew after paying a deposit','22% since launch')}</div>
 <div><p class="ct">Who joined and who left, month by month</p><div id="c1"></div><p class="note">Grey figures above each month: active participants with a full deposit at month end.</p><div class="legend"><span><i style="background:var(--green)"></i>Completed a full deposit</span><span><i style="background:var(--red)"></i>Left the programme</span></div></div></div>
 <div class="split">${facts(['Full-deposit participants peaked at 35 in April and ended September at 31.','5 new full deposits in 2026, against 5 exits. Growth has stalled.','Instalment payers doubled from 2 to 4, showing demand among applicants who cannot pay at once.','Every exit-survey respondent cited the R12,000 deposit. None cited communication or understanding of the programme.'])}
 ${table(['Month','Full deposit','Instalments','Joined','Left'],MF.map((x,k)=>[x,D.full[k],D.inst[k],D.joined[k],D.left[k]]),{selIdx:m,clickIdx:k=>k})}</div>
 ${recs(['Offer a phased deposit plan that runs longer than four months, settled by installation.','Run a planned intake to fill the 15 open places, with webinars at the points where applicants decide.','Track instalment payers monthly and support them to completion.','Adopt a 30-day inactivity trigger so operators get support before removal.'])}`},
 draw:m=>{const w=640,h=250,s=el('svg',{viewBox:`0 0 ${w} ${h}`},$('c1')),bw=w/9,mid=118,sc=28;
  el('line',{x1:0,x2:w,y1:mid,y2:mid,stroke:'#9aa0b8'},s);
  M.forEach((mm,k)=>{const x=k*bw+bw*.22,b=bw*.56;
   tx(s,x+b/2,14,D.full[k],{'text-anchor':'middle',style:`fill:var(--muted);font-weight:700;font-size:10px`});
   if(D.joined[k]){const r=el('rect',{x,y:mid-D.joined[k]*sc,width:b,height:D.joined[k]*sc,fill:'var(--green)','fill-opacity':op(k,m),style:'cursor:pointer'},s);r.onclick=()=>setM(k);tipOn(r,MF[k]+': '+D.joined[k]+' completed a full deposit');tx(s,x+b/2,mid-D.joined[k]*sc-6,'+'+D.joined[k],{'text-anchor':'middle',style:'fill:var(--green);font-weight:700'})}
   if(D.left[k]){const r=el('rect',{x,y:mid,width:b,height:D.left[k]*sc,fill:'var(--red)','fill-opacity':op(k,m),style:'cursor:pointer'},s);r.onclick=()=>setM(k);tipOn(r,MF[k]+': '+D.left[k]+' left');tx(s,x+b/2,mid+D.left[k]*sc+14,'-'+D.left[k],{'text-anchor':'middle',style:'fill:var(--red);font-weight:700'})}
   tx(s,x+b/2,h-6,mm,{'text-anchor':'middle',style:'fill:var(--navy);font-weight:700;font-size:10.5px'})})}};

P.machines={months:true,r:m=>{const i=m??8;
 return `<h1>Machines in place rose from 18 to 24 in 2026, and the waiting list fell from 13 to 7.</h1>
 ${kpi('KPI-03','Machines installed and in place','50','24','risk')}${kpi('KPI-04','Participants waiting for a machine','Fewer','7','risk')}
 <div class="split"><div class="stack">${stat(D.mac[i]+' of 50','Machines in place',`${MF[i]} 2026, up from 18 in January`)}${stat(D.wait[i],'Participants waiting for a machine','Down from 13 in January')}${stat('9 / 3','Installed / removed since January','Net gain of 6 machines')}</div>
 <div><p class="ct">Machines in place rise as the waiting list falls</p><div id="c1"></div><div class="legend"><span><i style="background:var(--navy)"></i>Machines in place</span><span><i style="background:var(--green)"></i>Participants waiting for a machine</span></div></div></div>
 <div class="split">${facts(['Placement came in bursts: three Sasko sites in March and three Eduvos campuses in May.','77% of participants with a full deposit now have a machine.','Student accommodation earns the most revenue, and three machines have moved to these sites.','Three new sites are being secured for waiting participants. The Future Life machine came out in September when its operator exited.'])}
 ${table(['Month','In place','Waiting','Installed','Removed'],MF.map((x,k)=>[x,D.mac[k],D.wait[k],D.minst[k],D.mrem[k]]),{selIdx:m,clickIdx:k=>k})}</div>
 ${recs(['Finalise the three allocated sites and redeploy the idle Future Life machine.','Prioritise student accommodation and factory sites for every new placement.','Let operators scout their own sites, with fast-tracked approval.','Place any idle machine within 30 days of a site closing.'])}`},
 draw:m=>lines($('c1'),[[D.mac,'var(--navy)',false,'machines in place'],[D.wait,'var(--green)',true,'waiting']],{m})};

P.revenue={months:true,r:m=>{const i=m??8,ytd=D.sales.slice(0,i+1).reduce((a,b)=>a+b,0);
 return `<h1>Revenue to date passes R1.5 million. Every machine in place is trading.</h1>
 <div class="split"><div class="stack">${stat(Rk(D.cum[i]),'Revenue to date',`Verified machine sales, January 2025 to ${MF[i]} 2026`)}${stat(Rk(ytd),'Revenue in 2026',`January to ${MF[i]} 2026. 2025 full year: R372,808`)}${stat('R171,912','Best month','May 2026')}</div>
 <div><p class="ct">Monthly revenue, 2026</p><div id="c1"></div><p class="note">NAYAX verified. Hatfield Studios added from June. September runs to 28 September.</p></div></div>
 <div class="split">${facts(['Revenue climbed from R53k in January to above R165k a month from March to May.','July dipped when student sites emptied over the winter break.','Student accommodation sites earn 60% of revenue.','The top three machines earn 55% of revenue.'])}
 ${table(['Site type','Share of revenue'],[['Student accommodation','60%'],['Factory or industrial','16%'],['Corporate office','11%'],['Tertiary campus','9%'],['Hospitality','4%']])}</div>
 ${recs(['Move low earning machines toward student accommodation and factory sites.','Lift the middle of the cohort so revenue relies less on the top three machines.','Resolve the PEPSICO stock discount so it reaches operators.'])}`},
 draw:m=>vbars($('c1'),M,D.sales,{m,fmt:Rk,tipf:k=>MF[k]+': '+RF(D.sales[k])})};

P.profit={months:[5,6,7,8],r:m=>{const i=m!=null&&D.prof[m]?m:null;
 const rows=[5,6,7,8].map(k=>{const p=D.prof[k];return[MF[k],p[0]+' of '+p[3],p[1]+' ('+Math.round(p[1]/p[0]*100)+'%)',p[2]]});
 return `<h1>Across June to September, just over half of responding operators reported a profit.</h1>
 ${kpi('KPI-08','Operators reporting a profit','100%','50% (8 of 16)','off')}
 <div class="split"><div class="stack">${stat(i!=null?D.prof[i][1]+' of '+D.prof[i][0]:'30 of 56','Responses reporting a profit',i!=null?MF[i]+' 2026':'54% across the four months')}${stat('R235','Typical profit/loss result','Median of all 56 responses')}${stat('67%','Survey response rate, September','16 of 24 machines in place responded')}</div>
 <div><p class="ct">Share of responding operators in profit</p><div id="c1"></div></div></div>
 <div class="split">${facts(['Profitability follows revenue: lowest in July, when student sites emptied over the winter break, and back above half by September.','Responses fell to 6 in August and recovered to 16 in September, so August is the least reliable month.','Profit is concentrated: in September two operators account for 61% of all reported profit.','The highest monthly profit reported is R8,000, at Arteria Parktown, in June, July and September.'])}
 ${table(['Month','Responded','In profit','Typical profit/loss'],rows,{selIdx:i!=null?i-5:null,clickIdx:k=>k+5})}</div>
 ${recs(['Place new and relocated machines at student accommodation and factory sites, where operators are most often profitable.','Help operators build cash buffers before university breaks, when student sites go quiet.','Keep monthly survey response above 60% with personal follow-up, so results can be trusted.','Resolve the PEPSICO stock discount: margin, not demand, limits most operators.'])}
 <p class="foot">About this data: self-reported in the monthly operator survey, which started in June 2026. Typical result is the median.</p>`},
 draw:m=>{const ks=[5,6,7,8];vbars($('c1'),['June','July','August','September'],ks.map(k=>Math.round(D.prof[k][1]/D.prof[k][0]*100)),{m,idx:j=>ks[j],max:100,fmt:v=>v+'%',sub:ks.map(k=>D.prof[k][1]+' of '+D.prof[k][0]),tipf:j=>MF[ks[j]]+': '+D.prof[ks[j]][1]+' of '+D.prof[ks[j]][0]+' in profit'})}};

P.training={months:true,r:m=>{const i=m??8;
 return `<h1>Training coverage fell from 82% to 69% as untrained participants joined and trained ones left.</h1>
 ${kpi('KPI-02','Participants who completed training','100%','68.6%','off')}${kpi('KPI-06','Participants who attended a full-day session','100%','68.6%','off')}
 <div class="split"><div class="stack">${stat(D.cover[i]+'%','Training coverage',`${MF[i]} 2026: trained participants still active`,'red')}${stat(D.trained[i]+' of 27','Trained participants still active','Trained at baseline in January')}${stat(D.meet[i],'Partner alignment sessions','Cumulative, target 50')}</div>
 <div><p class="ct">Share of active participants who are trained</p><div id="c1"></div><div class="legend"><span><i style="background:var(--red)"></i>Training coverage, %</span></div></div></div>
 <div class="split">${facts(['No training has run since January, so every new participant is untrained.','Three trained participants have left: two in May and one in September.','Partner alignment sessions are ahead of target, with one held every month.','Onboarding sessions reached 5, against a target of 2.'])}
 ${table(['Month','Coverage','Trained, active','Partner sessions','Onboarding'],MF.map((x,k)=>[x,D.cover[k]+'%',D.trained[k],D.meet[k],D.onb[k]]),{selIdx:m,clickIdx:k=>k})}</div>
 ${recs(['Run a catch-up training cycle for everyone who joined after January.','Make the full-day session part of onboarding for every new entrant.'])}`},
 draw:m=>lines($('c1'),[[D.cover,'var(--red)',false,'%']],{m,mx:100,ticks:[0,25,50,75,100]})};

P.kpi={months:false,r:()=>{const K=[['KPI-01','Active participants with a full deposit','50','31','31','off','31 of 50 places filled; 4 more paying in instalments'],['KPI-02','Participants who completed training','100%','81.8%','68.6%','off','No training since January; 24 of 35 active participants trained'],['KPI-03','Machines installed and in place','50','18','24','risk','Up 6 since January; 77% of full-deposit participants have a machine'],['KPI-04','Participants waiting for a machine','Fewer','13','7','risk','Down 6 since January; 3 new sites being secured'],['KPI-05','Partner alignment sessions held','50','55','63','on','Target exceeded; one session each month'],['KPI-06','Participants who attended a full-day session','100%','81.8%','68.6%','off','Falls as untrained participants join'],['KPI-07','Onboarding sessions delivered','2','3','5','on','Target exceeded; August session for new participants'],['KPI-08','Operators reporting a profit','100%','n/a','50%','off','September: 8 of 16 survey responses'],['KPI-09','Participants rating training positively','90%','78.6%','Closed','closed','Measured once; no further training this cycle'],['KPI-10','Improvement in living standards','90%','Score 75.0','Final report','risk','Starting score recorded; measured again at the final report'],['KPI-11','Participants applying new skills','90%','85.7%','Final report','risk','Close to target at the start; measured again at the final report'],['KPI-12','Participants reporting community recognition','90%','100%','Not re-measured','risk','Baseline 100% (n=10); not re-measured since'],['KPI-13','Confidence in commercial skills','Improve','66.7% / 40%','52.9% / 35.3% / 52.9%','risk','Technical / negotiate a location / explain margins (n=17). Baseline combined negotiate and margins'],['KPI-14','Entrepreneurial identity and agency','Evidence','Growth themes','Scaling','on','An operator paid off her machine and bought a second']];
 const c={on:0,risk:0,off:0,closed:0};K.forEach(k=>c[k[5]]++);
 return `<h1>KPI dashboard: progress against the 14 programme KPIs at September 2026.</h1>
 <div class="kpi" style="gap:6px 26px">${Object.entries(c).map(([k,n])=>`<span style="font-weight:700;color:${ST[k][1]}"><span class="dotc" style="background:${ST[k][1]}"></span>${n} ${ST[k][0]}</span>`).join('')}</div>
 <div style="margin-top:16px">${table(['KPI','Measure','Target','January 2026','September 2026','Status','Comment'],K.map(k=>[`<b style="color:var(--navy);white-space:nowrap">${k[0]}</b>`,k[1],k[2],k[3],`<b style="color:var(--navy)">${k[4]}</b>`,`<span style="color:${ST[k[5]][1]};font-weight:700;white-space:nowrap"><span class="dotc" style="background:${ST[k[5]][1]}"></span>${ST[k[5]][0]}</span>`,k[6]]))}</div>
 <p class="foot">KPI-08 has no January figure: profitability was measured on a different basis before June 2026. KPIs 10 to 13 were measured at the start of the programme and are measured again at the final report.</p>`}};

P.outcomes={months:false,r:()=>`<h1>Outcomes and matters for KDF. Participant outcomes at the start of the programme, against the 90% target.</h1>
 <div class="split"><div><p class="ct" style="text-align:left">Starting scores, February 2026</p><div id="c1"></div></div>
 <div class="stack"><div class="story"><h4>SUCCESS STORY</h4><div style="font-weight:700;color:var(--navy);font-size:15px;line-height:1.4">Tsholofetso Manana paid off her programme machine at Hatfield Studios, then bought a second machine independently.</div><div class="bs">Operator, Hatfield Studios, Pretoria. Top-earning site.</div></div>
 <div style="border:1.5px solid var(--red);border-radius:6px;padding:14px 16px"><h4 style="font:800 10px var(--f);letter-spacing:.08em;margin:0 0 6px;color:var(--red)">MATTERS FOR KDF'S ATTENTION</h4>${facts(['The PEPSICO stock discount is not reaching operators.','A formal protocol for inactive machines is still needed.','Two operators account for 61% of reported profit.','Five sites need service, power or relocation support.'])}</div></div></div>
 <div class="split">${stat('6 of 6','Applicants who declined a place cited the R12,000 deposit','None cited communication or understanding of the programme. Two would join if payment terms allowed.','red')}
 ${table(['Outcome','Starting score','September 2026'],[['Applying new skills','85.7%','Final report'],['Community recognition','100%','Not re-measured'],['Living standards score','75.0','Final report'],['Confident handling a technical breakdown','66.7%','52.9%'],['Confident negotiating and managing margins','40%','35.3% / 52.9%']])}</div>`,
 draw:()=>{const rows=[['Applying new skills',85.7],['Community recognition',100],['Living standards score',75],['Confident negotiating margins',40]];
  const w=420,s=el('svg',{viewBox:`0 0 ${w} ${rows.length*46}`},$('c1'));
  rows.forEach(([l,v],k)=>{const y=k*46,bw=(w-60)*v/100;tx(s,0,y+13,l,{style:'fill:var(--navy);font-weight:700;font-size:11px'});el('rect',{x:0,y:y+20,width:w-60,height:14,fill:'var(--grey)'},s);const r=el('rect',{x:0,y:y+20,width:bw,height:14,fill:'var(--navy)'},s);tipOn(r,l+': '+v+(k==2?'':'%'));
   el('line',{x1:(w-60)*.9,x2:(w-60)*.9,y1:y+16,y2:y+38,stroke:'var(--green)','stroke-width':2},s);tx(s,w-52,y+32,v+(k==2?'':'%'),{class:'v'})});}};

P.overview={months:true,r:m=>{const i=m??8;
 const cards=[['recruitment','Active participants',D.full[i]+' of 50','With a full deposit. '+D.inst[i]+' more paying in instalments','off'],['machines','Machines in place',D.mac[i]+' of 50',D.wait[i]+' participants waiting for a machine','risk'],['revenue','Revenue to date',Rk(D.cum[i]),'Verified sales since January 2025','on'],['profit','Operators in profit',D.prof[i]?D.prof[i][1]+' of '+D.prof[i][0]:'8 of 16',D.prof[i]?MF[i]+' survey':'September survey. Survey started in June','off'],['training','Training coverage',D.cover[i]+'%','Of active participants trained','off'],['kpi','KPI status','3 / 6 / 4','On track, at risk and off track of 14 KPIs','risk'],['outcomes','Success story','1','Operator paid off her machine and bought a second','on'],['recruitment','Withdrawals after a deposit','10 of 45','22% of everyone who has paid a deposit','off']];
 return `<h1>Revenue to date passes R1.5 million. Every machine in place is trading.</h1>
 <div class="cards">${cards.map(c=>`<button class="card" data-go="${c[0]}"><span class="cl">${c[1]}<span class="dotc" style="background:${ST[c[4]][1]};margin:0"></span></span><div class="cv">${c[2]}</div><div class="cs">${c[3]}</div><span class="go">Open →</span></button>`).join('')}</div>
 <div class="split" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)"><div><p class="ct">Monthly revenue, 2026</p><div id="c1"></div></div><div><p class="ct">Active participants by month</p><div id="c2"></div><div class="legend"><span><i style="background:var(--navy)"></i>Machine in place</span><span><i style="background:var(--lblue)"></i>Waiting</span></div></div></div>
 <div class="two"><div class="story"><h4>SUCCESS STORY</h4>Tsholofetso Manana has paid off her programme machine at Hatfield Studios and bought a second machine independently.</div><div class="dep"><h4>DEPLOYMENT PROGRESS</h4>A new machine went live at The Maslow Sandton in August. Three machines moved to student accommodation, and three new sites are being secured for participants waiting for machines.</div></div>`},
 draw:m=>{vbars($('c1'),M,D.sales,{m,fmt:Rk,h:230,tipf:k=>MF[k]+': '+RF(D.sales[k])});
  const w=320,h=230,B=22,T=16,s=el('svg',{viewBox:`0 0 ${w} ${h}`},$('c2')),bw=w/9,sc=(h-B-T)/40;
  M.forEach((mm,k)=>{const x=k*bw+bw*.15,b=bw*.7;const a=el('rect',{x,y:h-B-D.mac[k]*sc,width:b,height:D.mac[k]*sc,fill:'var(--navy)','fill-opacity':op(k,m),style:'cursor:pointer'},s);const c=el('rect',{x,y:h-B-(D.mac[k]+D.wait[k])*sc,width:b,height:D.wait[k]*sc,fill:'var(--lblue)','fill-opacity':op(k,m),style:'cursor:pointer'},s);
   a.onclick=c.onclick=()=>setM(k);tipOn(a,MF[k]+': '+D.mac[k]+' in place');tipOn(c,MF[k]+': '+D.wait[k]+' waiting');tx(s,x+b/2,h-B-(D.mac[k]+D.wait[k])*sc-5,D.mac[k]+D.wait[k],{'text-anchor':'middle',class:'v','font-size':9.5});tx(s,x+b/2,h-6,mm,{'text-anchor':'middle','font-size':9.5})})}};

/* navigation and month state */
const AREAS=[['overview','Overview'],['recruitment','Recruitment'],['machines','Machine placement'],['revenue','Revenue'],['profit','Profitability'],['training','Training'],['kpi','KPI scorecard'],['outcomes','Outcomes']];
let page='overview',mon=null;
AREAS.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.k=k;b.onclick=()=>go(k);$('nav').appendChild(b)});
function months(){const box=$('months'),cfg=P[page].months;box.querySelectorAll('button').forEach(b=>b.remove());
 const list=Array.isArray(cfg)?cfg:M.map((x,i)=>i);
 [['All months',null],...list.map(i=>[M[i],i])].forEach(([l,i])=>{const b=document.createElement('button');b.textContent=l;b.className=(mon??null)===i?'on':'';b.onclick=()=>setM(i);box.appendChild(b)});
 box.classList.toggle('off',!cfg);}
function render(){const p=P[page];if(Array.isArray(p.months)&&mon!=null&&!p.months.includes(mon))mon=null;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===page));
 months();$('page').innerHTML=p.r(mon);p.draw&&p.draw(mon);wireRows();
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));}
function go(k){page=k;try{history.replaceState(null,'','#'+k)}catch(e){}render();try{scrollTo({top:0,behavior:'smooth'})}catch(e){}}
function setM(i){mon=i;render()}
const h0=location.hash.slice(1);if(P[h0])page=h0;
render();
</script>

</body>
</html>
